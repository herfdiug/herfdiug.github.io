<!DOCTYPE html>

<html lang="en">

<head> 
    <title>S Hein</title>
</head>

<body>
   <h1>Head and Tail project</h1>
   <h2 id="coinFace">HEAD</h2>
   <button id="flipButton">Flip</button>
   s
</body>

<script>
    const element1 = document.getElementById("coinFace");
    const element2 = document.getElementById("flipButton");
    
    element2.onclick =()=>{
        const randomNumber = Math.floor(Math.random() * 2);

        if(randomNumber === 0){
            element1.innerText = "HEAD";
        }else{
            element1.innerText = "TAIL";
        }

    };
    
</script>

</html>
